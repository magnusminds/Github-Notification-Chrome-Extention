<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GitHub Notifier</title>
  <!-- Reuse the exact popover styling, then add popup-only sizing/theming -->
  <link rel="stylesheet" href="content.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="ghn-popup-root">
    <div class="ghn-header">
      <span class="ghn-title">Notifications</span>
      <div class="ghn-header-actions">
        <label class="ghn-participating-label" title="Show only notifications you are participating in">
          <input type="checkbox" id="ghn-participating" />
          <span>Participating only</span>
        </label>
        <button class="ghn-icon-btn" id="ghn-refresh-btn" aria-label="Refresh notifications"></button>
        <button class="ghn-icon-btn" id="ghn-mark-all-btn" aria-label="Mark all as read"></button>
      </div>
    </div>

    <div class="ghn-body" id="ghn-body">
      <div class="ghn-loading"><span>Loading…</span></div>
    </div>

    <div class="ghn-footer">
      <a href="https://github.com/notifications" id="ghn-view-all" class="ghn-footer-link"
         target="_blank" rel="noopener noreferrer">View all notifications →</a>
    </div>
  </div>

  <script src="ghn-ui.js"></script>
  <script src="popup.js"></script>
</body>
</html>
